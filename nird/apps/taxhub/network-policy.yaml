apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-taxhub
spec:
  podSelector:
    matchLabels:
      app: taxhub
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: metatrack-api
      ports:
        - protocol: TCP
          port: 8080
