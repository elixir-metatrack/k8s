apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sftpgo-ingress
  namespace: elixir-uit-ns11105k
spec:
  podSelector:
    matchLabels:
      app: elixir-uit-ns11105k-sftpgo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elixir-uit-ns11105k
          podSelector:
            matchLabels:
              app: metatrack-api
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 2022
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sftpgo-egress
  namespace: elixir-uit-ns11105k
spec:
  podSelector:
    matchLabels:
      app: elixir-uit-ns11105k-sftpgo
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sftpgo-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elixir-uit-ns11105k
          podSelector:
            matchLabels:
              app: metatrack-api
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 1234
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443