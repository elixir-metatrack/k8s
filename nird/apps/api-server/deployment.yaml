apiVersion: apps/v1
kind: Deployment
metadata:
  name: metatrack-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metatrack-api
  template:
    metadata:
      labels:
        app: metatrack-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/elixir-metatrack/api-server:main
          imagePullPolicy: Always
          env:
            - name: QUARKUS_HTTP_CORS_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: "*"
            - name: QUARKUS_LOG_CONSOLE_JSON_ENABLED
              value: "true"
            - name: QUARKUS_LOG_CONSOLE_JSON_LOG_FORMAT
              value: "ECS"
            - name: QUARKUS_HTTP_ACCESS_LOG_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_ACCESS_LOG_EXCLUDE_PATTERN
              value: '^/api/users/search(?:/.*)?$'
            - name: QUARKUS_HTTP_ACCESS_LOG_LOG_TO_FILE
              value: "false"
            - name: QUARKUS_LOG_CATEGORY__IO_QUARKUS_HTTP_ACCESS_LOG__LEVEL
              value: "INFO"
            - name: QUARKUS_VIRTUAL_THREADS_ENABLED
              value: "true"
            # 1. Database Configuration
            - name: QUARKUS_DATASOURCE_DB_KIND
              value: "postgresql"
            - name: JDBC_STRING
              value: "jdbc:postgresql://metatrack-db:5432/metatrack"
            - name: DB_USERNAME
              value: "metatrack"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metatrack-postgres-secret
                  key: password
            - name: QUARKUS_HIBERNATE_ORM_SCHEMA_GENERATION
              value: "validate"
            - name: QUARKUS_FLYWAY_MIGRATE_AT_START
              value: "true"

            # 2. Keycloak / OIDC Configuration
            - name: KEYCLOAK_URL
              # Use the INTERNAL Keycloak URL for verification
              value: "https://auth.metatrack.no/realms/metatrack"
            - name: KEYCLOAK_BASE_URL
              value: "https://auth.metatrack.no"
            - name: KEYCLOAK_REALM
              value: "metatrack"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                 name: keycloak-admin-secret
                 key: client-id
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: client-secret
            - name: KEYCLOAK_USERNAME_CACHE_TTL
              value: "10M"
            - name: KEYCLOAK_USERNAME_CACHE_MAX_SIZE
              value: "1000"
            - name: QUARKUS_OIDC_CLIENT_ID
              value: "metatrack-api-admin"
            - name: KEYCLOAK_PROFILE_COUNTRY_ATTRIBUTE
              value: "Country"
            - name: KEYCLOAK_PROFILE_INSTITUTION_ATTRIBUTE
              value: "Institution"
            - name: KEYCLOAK_PROFILE_ORCID_ATTRIBUTE
              value: "ORCID"

            # 3. S3 / MinIO Configuration
            - name: S3_ENDPOINT
              value: "https://storage.metatrack.no"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_PATH_STYLE_ACCESS
              value: "true"
            - name: S3_ACCESS_KEY
              value: "minio"
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: password
            - name: S3_BUCKET_NAME
              value: "metatrack"

            # 3a. SFTPGo integration
            - name: SFTPGO_ENABLED
              value: "true"
            - name: SFTPGO_API_URL
              value: "http://sftpgo.elixir-uit-ns11105k.svc.cluster.local:80"
            - name: SFTPGO_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: bootstrap-admin-username
            - name: SFTPGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: bootstrap-admin-password
            - name: SFTPGO_SFTP_HOST
              value: "sftp.metatrack.no"
            - name: SFTPGO_SFTP_PORT
              value: "2022"
            - name: SFTPGO_S3_ENDPOINT
              value: "$(S3_ENDPOINT)"
            - name: SFTPGO_S3_REGION
              value: "$(S3_REGION)"
            - name: SFTPGO_S3_ACCESS_KEY
              value: "$(S3_ACCESS_KEY)"
            - name: SFTPGO_S3_SECRET_KEY
              value: "$(S3_SECRET_KEY)"
            - name: SFTPGO_S3_BUCKET_NAME
              value: "$(S3_BUCKET_NAME)"
            - name: SFTPGO_S3_PATH_STYLE_ACCESS
              value: "$(S3_PATH_STYLE_ACCESS)"
            - name: SFTPGO_HOOK_URL
              value: "http://metatrack-api.elixir-uit-ns11105k.svc.cluster.local:80/api/internal/sftpgo/events"
            - name: SFTPGO_HOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: hook-secret
            - name: SFTPGO_RESUME_MAX_SIZE_BYTES
              value: "53687091200"

            # 4. App specific (Adjust based on your actual config)
            - name: TAXON_API_URL
              value: "http://taxhub"
            - name: QUARKUS_HTTP_PORT
              value: "1234"

            # 5. OpenAPI
            - name: QUARKUS_SMALLRYE_OPENAPI_PATH
              value: "/openapi"
            - name: QUARKUS_SMALLRYE_OPENAPI_ALWAYS_INCLUDE
              value: "true"

            # 6. Invitation and SMTP Configuration
            - name: INVITATION_LOGIN_URL
              value: "https://metatrack.no/login"
            - name: INVITATION_REGISTRATION_URL
              value: "https://metatrack.no/register"
            - name: QUARKUS_MAILER_LOG_INVALID_RECIPIENTS
              value: "false"
            - name: QUARKUS_MAILER_LOG_REJECTED_RECIPIENTS
              value: "false"
            - name: QUARKUS_MAILER_MOCK
              value: "false"
            - name: SMTP_FROM
              value: "noreply@metatrack.no"
            - name: SMTP_HOST
              value: "smtp-relay.uit.no"
            - name: SMTP_PORT
              value: "25"
            - name: QUARKUS_MAILER_START_TLS
              value: "DISABLED"
            - name: QUARKUS_MAILER_LOGIN
              value: "DISABLED"
            - name: QUARKUS_MAILER_TLS
              value: "false"
            - name: QUARKUS_MAILER_TIMEOUT
              value: "30S"
            - name: QUARKUS_TLS_INVITATION_TRUST_ALL
              value: "false"
            - name: QUARKUS_TLS_INVITATION_HOSTNAME_VERIFICATION_ALGORITHM
              value: "HTTPS"

          ports:
            - containerPort: 1234

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"