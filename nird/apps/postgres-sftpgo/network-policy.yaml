apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sftpgo-to-postgres-ingress
  namespace: elixir-uit-ns11105k
spec:
  podSelector:
    matchLabels:
      app: sftpgo-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: elixir-uit-ns11105k-sftpgo
      ports:
        - protocol: TCP
          port: 5432